<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Копилка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--bg:#efe7d8;--bg2:#e6dccb;--bg3:#f4eee2;--tx:#3a4130;--hint:#8a846f;--btn:#3e452f;--btnt:#f1eadb;--dk:#3e452f;--line:rgba(62,69,47,.16);--danger:#a8483a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:15px/1.35 "Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
input,textarea{font-size:16px;width:100%;color:var(--tx);outline:none;font-family:inherit;-webkit-appearance:none;appearance:none;border-radius:0;user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
svg{display:block}
.lf svg{width:100%;height:auto}
#app{position:fixed;left:0;right:0;top:0;height:var(--h,100%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.tb{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 4px;flex:none}
.ib{width:44px;height:44px;display:grid;place-items:center;position:relative;flex:none}
.ib b{position:absolute;top:5px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--dk);color:var(--btnt);font:600 10px/17px "Jost",sans-serif;text-align:center;padding:0 4px}
.brand{text-align:center}
.logo{font:500 30px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.14em;padding-left:.14em}
.brand .sub{font-size:7.5px;letter-spacing:.34em;color:var(--hint);margin-top:4px;padding-left:.34em}
#list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px}
.pad{min-height:calc(100% + 2px);padding-bottom:24px}
.hi{padding:10px 2px 14px}
.hi h2{margin:0;font:500 24px "Cormorant Garamond",Georgia,serif}
.hi p{margin:2px 0 0;font-size:13px;color:var(--hint)}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:20px 18px;min-height:176px;background:linear-gradient(135deg,#dcd0ba,#cdc1a8 60%,#bfb399)}
.hero .lf{position:absolute;right:-8px;bottom:-16px;width:150px;color:rgba(62,69,47,.3)}
.hl{position:relative;max-width:64%}
.hl small{font-size:10px;letter-spacing:.14em}
.hl h3{margin:8px 0 4px;font:500 22px/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hl em{display:block;font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hint);margin-bottom:14px}
.bt{background:var(--dk);color:var(--btnt);font-size:11px;letter-spacing:.14em;padding:9px 18px;border-radius:7px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px;font-size:12px;letter-spacing:.14em;font-weight:500}
.sh button{font-size:11px;letter-spacing:.1em;text-decoration:underline;text-underline-offset:3px;color:var(--hint)}
.cg{display:flex;justify-content:space-between;gap:4px}
.cc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.cc i{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);color:var(--dk)}
.cc i b{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;background:var(--dk);color:var(--btnt);font:600 10px/17px "Jost",sans-serif;text-align:center;padding:0 4px}
.promo{display:flex;align-items:center;gap:14px;width:100%;margin-top:20px;padding:16px;border-radius:14px;background:var(--bg2)}
.pl{color:var(--hint);flex:none}
.pt{flex:1;font:500 13px/1.3 "Jost",sans-serif;letter-spacing:.1em}
.pt small{display:block;margin-top:6px;font-size:10px;letter-spacing:.12em;color:var(--hint)}
.ttl{position:relative;padding:12px 2px 12px}
.ttl h1{margin:0;font:500 24px "Cormorant Garamond",Georgia,serif;letter-spacing:.06em}
.ttl p{margin:4px 0 0;max-width:68%;font-size:13px;line-height:1.35;color:var(--hint)}
.ttl .lf{position:absolute;right:0;top:2px;width:66px;color:rgba(62,69,47,.25)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:7px 16px;border-radius:16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line)}
.pill.on{background:var(--dk);color:var(--btnt);border-color:var(--dk)}
.srch{display:flex;align-items:center;gap:8px;margin:8px 0 4px;padding:0 12px;border-radius:12px;border:1px solid var(--line);color:var(--hint)}
.srch input{border:0;background:none;padding:11px 0}
.card{position:relative;display:flex;gap:12px;margin-top:10px;padding:8px;border-radius:14px;background:var(--bg2);min-height:92px}
.th{flex:none;width:76px;height:76px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#d8ccb6,#c3b79d);color:var(--dk)}
.bd{flex:1;min-width:0;padding:4px 40px 26px 0}
.tt{font-size:13px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{font-size:12px;color:var(--hint);margin-top:3px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dt{position:absolute;left:96px;bottom:12px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hint)}
.ck{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--dk);color:var(--dk)}
.ck svg{opacity:.35}
.done .ck{background:var(--dk);color:var(--btnt)}
.done .ck svg{opacity:1}
.card.done .tt,.card.done .mt{opacity:.55}
.card.done .tt{text-decoration:line-through}
.lk{position:absolute;right:8px;top:6px;width:32px;height:32px;display:grid;place-items:center;color:var(--hint)}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:14px;border-radius:14px;border:1px dashed var(--hint);font-size:12px;letter-spacing:.14em;color:var(--hint)}
.empty{text-align:center;color:var(--hint);padding:36px 20px;font-size:13px;letter-spacing:.04em}
.empty svg{margin:0 auto 10px;opacity:.6}
.box{border-radius:14px;background:var(--bg2);padding:4px 14px}
.rw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.rw:last-child{border:0}
.rw span{display:flex;align-items:center;gap:10px}
.rw b{font-weight:500;font-size:15px}
.fld{border-radius:12px;border:1px solid var(--line);background:var(--bg3);padding:2px 12px}
.fld input,.fld textarea{border:0;background:none;padding:11px 0}
.fld textarea{min-height:90px;resize:none}
.lb{margin:16px 2px 6px;font-size:11px;letter-spacing:.14em;color:var(--hint)}
.big{display:block;width:100%;margin-top:18px;padding:15px;border-radius:9px;background:var(--dk);color:var(--btnt);text-align:center;font-size:13px;letter-spacing:.16em;font-weight:500}
.big.o{background:none;border:1px solid var(--dk);color:var(--dk)}
.big.x{background:none;color:var(--danger);margin-top:6px}
.big.x.arm{background:var(--danger);color:#fff}
.two{display:flex;gap:10px}
.two .big{flex:1}
.sec{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 4px;font-size:10px;letter-spacing:.12em;color:var(--hint)}
.eh{margin:6px 2px 8px;font:500 22px "Cormorant Garamond",Georgia,serif;letter-spacing:.08em}
#nav{flex:none;display:flex;background:var(--dk);padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:#aaa68c;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.nv.on{color:#f3ecdc}
#ov{position:absolute;inset:0;z-index:5;background:var(--bg)}
#ov[hidden]{display:none}
#sheet{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top,0px) 16px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet .tb{padding-left:0;padding-right:0}
#toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;background:var(--dk);color:var(--btnt);padding:9px 14px;border-radius:10px;font-size:13px;text-align:center;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#splash{position:absolute;inset:0;z-index:20;background:#505b42;color:#ebe3cf;transition:opacity .45s;overflow:hidden}
#splash.off{opacity:0;pointer-events:none}
#splash .ct{position:absolute;left:0;right:0;top:36%;text-align:center}
#splash .sl{font:500 56px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.14em;padding-left:.14em}
#splash .ss{font-size:12px;letter-spacing:.4em;margin-top:14px;padding-left:.4em}
#splash .or{margin:22px auto 0;width:44px;opacity:.8}
#splash .lf{position:absolute;right:-10px;bottom:110px;width:190px;color:rgba(255,255,255,.14)}
#splash .tg{position:absolute;left:22px;bottom:calc(98px + env(safe-area-inset-bottom,0px));font-size:13px;letter-spacing:.12em;line-height:1.4}
#splash .lt{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;letter-spacing:.24em}
.ld{position:absolute;left:22px;right:22px;bottom:calc(40px + env(safe-area-inset-bottom,0px));height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.ld i{display:block;height:100%;width:0;background:#efe7d8;animation:ld 1.2s ease-out forwards}
@keyframes ld{to{width:100%}}

.th.ph{background-size:cover;background-position:center}
.dt.pr{font:500 17px "Jost",sans-serif;letter-spacing:.02em;text-transform:none;color:var(--tx)}
.dt.dd{display:flex;align-items:center;gap:5px;color:var(--dk)}
.sw{position:absolute;right:12px;bottom:12px;width:46px;height:27px;border-radius:14px;background:rgba(62,69,47,.25);transition:background .2s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
.sw.on{background:var(--dk)}
.sw.on i{transform:translateX(19px)}
.swr{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);font-size:12px;letter-spacing:.14em}
.swr .sw{position:relative;right:auto;bottom:auto}
.pz{border:1.5px dashed var(--hint);border-radius:12px;min-height:84px;padding:30px 12px;text-align:center;color:var(--hint);font-size:12px;letter-spacing:.06em;caret-color:transparent;outline:none;user-select:text;-webkit-user-select:text}
.pz::before{content:attr(data-t)}
.pv{position:relative;height:200px;border-radius:12px;background-size:cover;background-position:center;background-color:var(--bg2)}
.pv button{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.pv button svg{transform:rotate(45deg)}
.big.sm{margin-top:8px;padding:11px;font-size:11px}
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{flex:1;text-align:center;padding:11px;border-radius:10px;border:1px solid var(--line);font-size:12px;letter-spacing:.08em}
.seg button.on{background:var(--dk);color:var(--btnt);border-color:var(--dk)}
.dtf{display:flex;align-items:center}
.dtf input{min-height:44px}
.dtf button{flex:none;width:34px;height:34px;display:grid;place-items:center;color:var(--hint)}
.dtf button svg{transform:rotate(45deg)}
.hint{margin:6px 2px 0;font-size:11px;letter-spacing:.04em;color:var(--hint)}
.ch{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.ch h2{margin:0;font:500 20px "Cormorant Garamond",Georgia,serif;letter-spacing:.08em;text-transform:uppercase}
.ch button{width:40px;height:40px;display:grid;place-items:center}
.cgd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center}
.wd{font-size:10px;letter-spacing:.1em;color:var(--hint);padding:4px 0}
.dy{width:40px;height:40px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:14px;text-align:center}
.dy.td{box-shadow:inset 0 0 0 1px var(--hint)}
.dy.ev{background:var(--dk);color:var(--btnt)}
.dy.ev.dn{background:var(--bg2);color:var(--dk);box-shadow:inset 0 0 0 1px var(--dk)}
.dy.sl{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--dk)}
.nv{font-size:9px;letter-spacing:.06em}
</style>
</head>
<body>
<div id="app">
  <header id="top" class="tb"></header>
  <main id="list"><div class="pad" id="items"></div></main>
  <nav id="nav"></nav>
  <div id="ov" hidden><div id="sheet"></div></div>
  <div id="toast"></div>
  <div id="splash">
    <div class="ct"><div class="sl">КОПИЛКА</div><div class="ss">ЗАМЕТКИ И ИДЕИ</div>
      <svg class="or" viewBox="0 0 44 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M2 8c6-6 12-6 20 0 8 6 14 4 20-2M10 11c8 3 16 3 24 0"/></svg></div>
    <div class="lf" id="sl_lf"></div>
    <div class="tg">ВСЁ ВАЖНОЕ.<br>В ОДНОМ МЕСТЕ.</div>
    <div class="lt">ЗАГРУЗКА…</div>
    <div class="ld"><i></i></div>
  </div>
</div>
<script>
(function(){
"use strict";
/* ---------- Telegram bridge (без внешнего SDK) ---------- */
window.Telegram=window.Telegram||{};
window.Telegram.WebView=window.Telegram.WebView||{};
var inTG=false;
function tgPost(ev,data){
  try{
    if(window.TelegramWebviewProxy&&window.TelegramWebviewProxy.postEvent){window.TelegramWebviewProxy.postEvent(ev,JSON.stringify(data||{}));return true;}
    if(window.parent&&window.parent!==window){window.parent.postMessage(JSON.stringify({eventType:ev,eventData:data||{}}),'*');return true;}
  }catch(e){}
  return false;
}
function hexOk(v){return typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);}
function applyTheme(t){
  return; /* фирменная палитра, тему Telegram не подмешиваем */
  var m={bg_color:'--bg',secondary_bg_color:'--bg2',text_color:'--tx',hint_color:'--hint',button_color:'--btn',button_text_color:'--btnt',destructive_text_color:'--danger'};
  for(var k in m){if(hexOk(t[k]))document.documentElement.style.setProperty(m[k],t[k]);}
  if(hexOk(t.bg_color)){var c=parseInt(t.bg_color.slice(1),16),l=((c>>16&255)*299+(c>>8&255)*587+(c&255)*114)/1000;document.documentElement.setAttribute('data-theme',l<128?'dark':'light');}
}
function applyChrome(){
  tgPost('web_app_ready');
  tgPost('web_app_expand');
  tgPost('web_app_setup_swipe_behavior',{allow_vertical_swipe:false});
  tgPost('web_app_set_header_color',{color:'#efe7d8'});
  tgPost('web_app_set_background_color',{color:'#efe7d8'});
  tgPost('web_app_set_bottom_bar_color',{color:'#3e452f'});
}
function setConfirm(on){tgPost('web_app_setup_closing_behavior',{need_confirmation:!!on});}
try{
  var hp=new URLSearchParams(location.hash.slice(1));
  if(hp.get('tgWebAppThemeParams')){applyTheme(JSON.parse(hp.get('tgWebAppThemeParams')));inTG=true;}
  if(hp.get('tgWebAppVersion'))inTG=true;
}catch(e){}
window.Telegram.WebView.receiveEvent=function(ev,data){
  try{if(ev==='theme_changed'&&data)applyTheme(data.theme_params);}catch(e){}
};
window.addEventListener('message',function(e){
  try{var d=typeof e.data==='string'?JSON.parse(e.data):e.data;
    if(d&&d.eventType==='theme_changed'&&d.eventData)applyTheme(d.eventData.theme_params);}catch(x){}
});
applyChrome();
document.addEventListener('visibilitychange',function(){if(!document.hidden)applyChrome();});

/* ---------- Запрет зума ---------- */
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});
window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>-1)e.preventDefault();});
document.addEventListener('contextmenu',function(e){if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault();});

/* ---------- Высота под клавиатуру ---------- */
var app=document.getElementById('app');
function fit(){
  var vv=window.visualViewport;
  app.style.setProperty('--h',(vv?vv.height:window.innerHeight)+'px');
  app.style.top=(vv?vv.offsetTop:0)+'px';
  if(window.scrollY)window.scrollTo(0,0);
}
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit);}
window.addEventListener('resize',fit);fit();

/* ---------- Защита от закрытия свайпом (запасной приём) ---------- */
function guardScroll(el){
  el.addEventListener('touchstart',function(){
    if(el.scrollTop<=0)el.scrollTop=1;
    else if(el.scrollTop+el.clientHeight>=el.scrollHeight)el.scrollTop=el.scrollHeight-el.clientHeight-1;
  },{passive:true});
}
var listEl=document.getElementById('list'),sheet=document.getElementById('sheet'),ov=document.getElementById('ov');
guardScroll(listEl);guardScroll(sheet);
ov.addEventListener('touchmove',function(e){if(!sheet.contains(e.target))e.preventDefault();},{passive:false});

/* ---------- Данные ---------- */
var KEY='kopilka_v1',BK='kopilka_v1_backup';
var CATS=[
 {id:'reel',ic:'🎬',name:'Рилсы',ph:'О чём ролик?',link:1,done:'Разобрано',empty:'Сохраняй ролики, чтобы не потерять'},
 {id:'note',ic:'📝',name:'Записи',ph:'Заголовок',empty:'Пока нет записей'},
 {id:'movie',ic:'🍿',name:'Фильмы',ph:'Название',link:1,done:'Посмотрено',empty:'Что хочется посмотреть?'},
 {id:'gift',ic:'🎁',name:'Подарки',ph:'Что подарить?',link:1,who:'Кому / по какому поводу',price:1,done:'Куплено',empty:'Идеи подарков живут здесь'},
 {id:'date',ic:'💕',name:'Свидания',ph:'Идея свидания',link:1,when:1,done:'Было',empty:'Куда сходить вдвоём?'}
];
var mem=[];
function C(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[0];}
function clean(a){
  if(!Array.isArray(a))return [];
  var seen={},out=[];
  a.forEach(function(x){
    if(!x||typeof x!=='object'||typeof x.title!=='string')return;
    var id=typeof x.id==='string'&&x.id&&!seen[x.id]?x.id:uid();seen[id]=1;
    out.push({id:id,cat:CATS.some(function(c){return c.id===x.cat;})?x.cat:'note',title:x.title.slice(0,200),url:typeof x.url==='string'?x.url.slice(0,2000):'',note:typeof x.note==='string'?x.note.slice(0,5000):'',done:!!x.done,ts:+x.ts||Date.now(),price:(typeof x.price==='string'||typeof x.price==='number')?String(x.price).slice(0,20):'',cur:x.cur==='USD'?'USD':'KZT',when:/^\d{4}-\d{2}-\d{2}$/.test(x.when||'')?x.when:'',img:(typeof x.img==='string'&&x.img.length<400000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(x.img))?x.img:''});
  });
  return out;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{return clean(JSON.parse(raw));}catch(e){
    try{localStorage.setItem(KEY+'_corrupt',raw);}catch(x){}
    try{var b=localStorage.getItem(BK);if(b){toast('Данные повреждены, восстановил из копии');return clean(JSON.parse(b));}}catch(x){}
  }}
  return [];
}
var warned=false;
function save(){
  try{
    var s=JSON.stringify(mem);
    localStorage.setItem(KEY,s);

    if(window.__sync)window.__sync();

function readImg(f,cb){
  if(!f||!/^image\//.test(f.type||'')){toast('Это не картинка');return;}
  var fr=new FileReader();
  fr.onerror=function(){toast('Не удалось прочитать картинку');};
  fr.onload=function(){
    var im=new Image();
    im.onerror=function(){toast('Формат картинки не поддерживается');};
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight;if(!w||!h){toast('Пустая картинка');return;}
      var k=Math.min(1,720/Math.max(w,h)),cv=document.createElement('canvas');
      cv.width=Math.round(w*k);cv.height=Math.round(h*k);
      var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      var d='';try{d=cv.toDataURL('image/jpeg',0.72);}catch(e){}
      if(d.length<100||d.length>390000){toast('Картинка слишком большая');return;}
      cb(d);
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}
function pasteBtn(cb){

    var got=0;
    items.forEach(function(it){
      if(got)return;
      var t=it.types.filter(function(x){return x.indexOf('image/')===0;})[0];
      if(t){got=1;it.getType(t).then(function(b){readImg(b,cb);});}
    });
    if(!got)toast('В буфере нет картинки');

     +(c.done?'<div class="swr"><span>'+(S.dn?'ВЫПОЛНЕНО':'НЕ ВЫПОЛНЕНО')+'</span><button class="sw'+(S.dn?' on':'')+'" id="f_dn" role="switch" aria-checked="'+(S.dn?'true':'false')+'" aria-label="'+c.done+'"><i></i></button></div>':'')
     +'<button class="big" id="f_s">СОХРАНИТЬ</button>'+(isNew?'':'<button class="big x" id="f_d">УДАЛИТЬ</button>')
     +'<div class="sec">'+svg('lock',13)+' ХРАНИТСЯ НА ЭТОМ УСТРОЙСТВЕ</div>');
    sheet.scrollTop=st;
    $('f_t').placeholder=c.ph;
    bindf('f_t','t');bindf('f_u','u');bindf('f_n','n');bindf('f_w','w');
    var pe=$('f_p');
    if(pe){pe.value=S.p;pe.addEventListener('input',function(){var v=pe.value.replace(/[^0-9.,]/g,'').slice(0,12);if(v!==pe.value)pe.value=v;S.p=v;markDirty();});}
    Array.prototype.forEach.call(sheet.querySelectorAll('[data-cur]'),function(b){b.onclick=function(){S.cur=b.getAttribute('data-cur');markDirty();draw();};});
    Array.prototype.forEach.call(sheet.querySelectorAll('[data-k]'),function(b){b.onclick=function(){S.c=b.getAttribute('data-k');draw();};});
    var pz=$('f_pz');
    if(pz){
      pz.addEventListener('keydown',function(e){if(!(e.ctrlKey||e.metaKey))e.preventDefault();});
      pz.addEventListener('input',function(){pz.textContent='';});
      pz.addEventListener('drop',function(e){e.preventDefault();});
    }
    function setImg(d){S.img=d;markDirty();draw();}
    if($('f_pb'))$('f_pb').onclick=function(){pasteBtn(setImg);};
    if($('f_ix'))$('f_ix').onclick=function(){S.img='';markDirty();draw();};
    if($('f_wc'))$('f_wc').onclick=function(){S.w='';markDirty();draw();};
    if($('f_dn'))$('f_dn').onclick=function(){S.dn=!S.dn;markDirty();draw();};
    sheet.onpaste=function(e){
      var its=(e.clipboardData&&e.clipboardData.items)||[],f=null;
      for(var i=0;i<its.length;i++)if(its[i].type.indexOf('image/')===0){f=its[i].getAsFile();break;}
      if(!f||S.c==='note')return;
      e.preventDefault();readImg(f,setImg);
    };
    $('f_b').onclick=tryClose;
    $('f_s').onclick=function(){
      var cc=C(S.c),url='';
      if(cc.link){url=normUrl(S.u);if(url===null){toast('Ссылка выглядит неверно');return;}}
      if(cc.price&&S.p!==''&&!(parseFloat(String(S.p).replace(',','.'))>=0)){toast('Цена указана неверно');return;}
      var title=S.t.trim();if(!title)title=url?host(url):'';
      if(!title){toast('Напиши название или вставь ссылку');return;}
      var w=cc.when&&/^\d{4}-\d{2}-\d{2}$/.test(S.w)?S.w:'';
      var o={title:title,url:url,note:S.n.trim(),price:cc.price?String(S.p).replace(',','.'):'',cur:S.cur,when:w,img:cc.id!=='note'?S.img:'',done:cc.done?!!S.dn:false};
      if(item){for(var k in o)item[k]=o[k];}
      else{o.id=uid();o.cat=S.c;o.ts=Date.now();mem.push(o);}
      if(view==='list'&&cat!=='all')cat=S.c;
      save();closeSheet();render();
    };
    var d=$('f_d');
    if(d){var armed=false;d.onclick=function(){
      if(!armed){armed=true;d.textContent='ТОЧНО УДАЛИТЬ?';d.classList.add('arm');setTimeout(function(){armed=false;d.textContent='УДАЛИТЬ';d.classList.remove('arm');},3000);return;}
      mem=mem.filter(function(x){return x.id!==item.id;});save();closeSheet();render();toast('Удалено');
    };}
  }
  draw();
  if(isNew&&!pre)setTimeout(function(){var t=$('f_t');if(t)try{t.focus();}catch(e){}},150);
}

/* ---------- Резервная копия ---------- */
function exp(){
  var t=$('c_t');if(!t)return;
  t.value=JSON.stringify(mem);t.focus();t.select();
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  toast(ok?'Скопировано в буфер':'Выдели текст и скопируй вручную');
}
function imp(){
  var t=$('c_t'),v=t?t.value.trim():'';if(!v){toast('Сначала вставь копию');return;}
  try{
    var inc=clean(JSON.parse(v));if(!inc.length){toast('В копии нет записей');return;}
    var ids={},add=0;mem.forEach(function(x){ids[x.id]=1;});
    inc.forEach(function(x){if(!ids[x.id]){mem.push(x);add++;}});
    save();render();toast('Добавлено записей: '+add);
  }catch(e){toast('Не удалось прочитать копию');}
}

/* ---------- События ---------- */
$('app').addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-a]'):null;if(!t)return;
  var p=t.getAttribute('data-a').split(':'),k=p[0],v=p[1],it=null;
  for(var i=0;i<mem.length;i++)if(mem[i].id===v)it=mem[i];
  if(k==='nav')go(v,'all');
  else if(k==='cat')go('list',v);
  else if(k==='pc'){cat=v;qs='';render();listEl.scrollTop=0;}
  else if(k==='add')openEdit(null);
  else if(k==='open'&&it)openEdit(it);
  else if(k==='tog'&&it){it.done=!it.done;save();render();}
  else if(k==='link'&&it)openLink(it.url);
  else if(k==='cm'){var d0=new Date(cm.y,cm.m+(+v),1);cm={y:d0.getFullYear(),m:d0.getMonth()};csel='';render();}
  else if(k==='cd'){csel=(csel===v?'':v);render();}
  else if(k==='addd')openEdit(null,{c:'date',w:v});
  else if(k==='sync')syncNow();
  else if(k==='exp')exp();
  else if(k==='imp')imp();
});
window.addEventListener('storage',function(e){if(e.key===KEY){mem=load();render();}});
var syT;
window.__sync=function(){clearTimeout(syT);if(!CFG.url||!initData)return;syT=setTimeout(doSync,1500);};
function paintSync(){var e=$('sync_st');if(e)e.textContent=syncSt;}
function doSync(){
  var ev=mem.filter(function(x){return x.cat==='date'&&x.when&&!x.done;}).map(function(x){return {id:x.id,title:x.title,date:x.when,url:x.url};});
  try{
    fetch(CFG.url+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:initData,events:ev})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(o){syncSt=o.ok?('Готово · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' · дат: '+ev.length):('Ошибка: '+((o.j&&o.j.error)||'сервер отказал'));paintSync();})
    .catch(function(){syncSt='Нет связи с сервером';paintSync();});
  }catch(e){syncSt='Нет связи с сервером';paintSync();}
}
function syncNow(){
  var i=$('s_u'),v=i?i.value.trim():'';
  if(v){var u=normUrl(v);if(!u||u.indexOf('https://')!==0){toast('Нужен адрес вида https://…');return;}CFG.url=u.replace(/\/+$/,'');}else CFG.url='';
  try{localStorage.setItem('kopilka_cfg',JSON.stringify(CFG));}catch(e){}
  if(!CFG.url){syncSt='Напоминания выключены';paintSync();return;}
  if(!initData){syncSt='Открой приложение из Telegram, чтобы привязать аккаунт';paintSync();return;}
  syncSt='Проверяю…';paintSync();doSync();
}
$('sl_lf').innerHTML=LEAF;
render();
setTimeout(function(){var s=$('splash');if(!s)return;s.classList.add('off');setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},500);},1300);
})();
</script>
